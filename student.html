<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الطالب - نظام السنتر التعليمي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --border-soft:#eef1f6;

    --indigo:#4f46e5;
    --indigo-dark:#4338ca;
    --indigo-bg:#eef2ff;
    --purple:#7c3aed;

    --emerald:#10b981;
    --emerald-dark:#059669;
    --emerald-bg:#ecfdf5;

    --red:#ef4444;
    --red-bg:#fef2f2;

    --text:#0f172a;
    --muted:#64748b;
    --muted-2:#94a3b8;

    --shadow-md:0 10px 30px rgba(79,70,229,.1);
    --radius-lg:22px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    font-family:'Cairo',sans-serif;
    color:var(--text);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .container{
    width:100%;
    max-width:480px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    box-shadow:var(--shadow-md);
    padding:30px;
    text-align:center;
  }
  .top-badge{
    background:linear-gradient(120deg,var(--indigo),var(--purple));
    color:#fff;
    padding:18px;
    border-radius:16px;
    margin-bottom:24px;
  }
  .top-badge h1{
    margin:0;
    font-size:18px;
    font-weight:800;
  }
  .top-badge p{
    margin:4px 0 0;
    font-size:12.5px;
    color:rgba(255,255,255,.85);
  }
  .student-name{
    font-size:24px;
    font-weight:900;
    color:var(--text);
    margin:0 0 6px;
  }
  .student-code{
    display:inline-block;
    background:var(--indigo-bg);
    color:var(--indigo-dark);
    padding:6px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:800;
    margin-bottom:24px;
  }
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    text-align:right;
    margin-bottom:20px;
  }
  .info-box{
    background:#f8fafc;
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:14px;
  }
  .info-box .label{
    font-size:11.5px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:4px;
  }
  .info-box .val{
    font-size:15px;
    font-weight:800;
    color:var(--text);
  }
  .info-box.full{
    grid-column:span 2;
  }
  .status-badge{
    display:inline-block;
    padding:6px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:800;
  }
  .status-badge.paid{background:var(--emerald-bg);color:var(--emerald-dark);}
  .status-badge.unpaid{background:var(--red-bg);color:var(--red);}

  .loading, .error-box{
    padding:30px;
    font-size:15px;
    font-weight:700;
    color:var(--muted);
  }
  .error-box{color:var(--red);}
</style>
</head>
<body>

<div class="container">
  <div class="card" id="cardContent">
    <div class="loading">جاري تحميل بيانات الطالب...</div>
  </div>
</div>

<script>
/* =========================================================
   FIREBASE CONFIG
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD6UDuCBns0_zdWOhnLOX3OtKelHs3hGmc",
  authDomain: "altafawuk-center.firebaseapp.com",
  databaseURL: "https://altafawuk-center-default-rtdb.firebaseio.com",
  projectId: "altafawuk-center",
  storageBucket: "altafawuk-center.firebasestorage.app",
  messagingSenderId: "499180495752",
  appId: "1:499180495752:web:6f2e72fb4e87f8becc103d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================================================
   FETCH & RENDER STUDENT DATA
   ========================================================= */
const urlParams = new URLSearchParams(window.location.search);
const studentCode = urlParams.get('code');
const cardContent = document.getElementById('cardContent');

if (!studentCode) {
  cardContent.innerHTML = `<div class="error-box">⚠️ لم يتم تحديد كود الطالب في الرابط.</div>`;
} else {
  db.ref('students/' + studentCode).once('value').then((snap) => {
    if (!snap.exists()) {
      cardContent.innerHTML = `<div class="error-box">⚠️ عذراً، هذا الطالب غير مسجل في النظام.</div>`;
      return;
    }

    const s = snap.val();
    const attended = Number(s.attendedSessions) || 0;
    const total = Number(s.totalSessions) || 0;
    const grade = (s.examGrade !== undefined && s.examGrade !== null) ? s.examGrade : 0;
    const feesPaid = !!s.feesPaid;
    const feesAmount = Number(s.fees) || 0;

    cardContent.innerHTML = `
      <div class="top-badge">
        <h1>نظام السنتر التعليمي</h1>
        <p>بيانات ومتابعة الطالب اللحظية</p>
      </div>
      
      <h2 class="student-name">${escapeHtml(s.name || 'بدون اسم')}</h2>
      <div class="student-code">الكود: ${escapeHtml(studentCode)}</div>

      <div class="info-grid">
        <div class="info-box">
          <div class="label">الحصص الحاضرة</div>
          <div class="val">${attended} من ${total}</div>
        </div>
        <div class="info-box">
          <div class="label">درجة الامتحان</div>
          <div class="val">${grade}</div>
        </div>
        <div class="info-box full">
          <div class="label">حالة المصاريف الشهرية (${feesAmount} ج.م)</div>
          <div class="val" style="margin-top:6px;">
            <span class="status-badge ${feesPaid ? 'paid' : 'unpaid'}">
              ${feesPaid ? 'تم السداد ✓' : 'لم يتم السداد'}
            </span>
          </div>
        </div>
      </div>
    `;
  }).catch((err) => {
    cardContent.innerHTML = `<div class="error-box">حدث خطأ أثناء جلب البيانات: ${escapeHtml(err.message)}</div>`;
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>

</body>
</html>
